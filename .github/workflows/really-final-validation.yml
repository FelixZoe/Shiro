name: Final end-to-end compatibility validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/really-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate
        shell: bash
        run: |
          set +e
          mkdir -p .github/final-validation

          pnpm --filter @shiro/web exec tsc --noEmit > .github/final-validation/typecheck.txt 2>&1
          printf '%s\n' "$?" > .github/final-validation/typecheck.status

          pnpm --filter @shiro/web run build:ci > .github/final-validation/build.txt 2>&1
          printf '%s\n' "$?" > .github/final-validation/build.status

          cat > /tmp/shiro.env <<'EOF'
          POSTGRES_PASSWORD=validation-password
          JWT_SECRET=validation-only-jwt-secret-with-sufficient-length
          ENCRYPT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PUBLIC_CORE_ORIGIN=http://localhost:2333
          PUBLIC_CORE_API_URL=http://localhost:2333/api/v3
          MONGO_URI=mongodb://host.docker.internal:27017/mx-space
          MIGRATION_MODE=dry-run
          EOF

          docker compose --env-file /tmp/shiro.env config > .github/final-validation/compose.txt 2>&1
          printf '%s\n' "$?" > .github/final-validation/compose.status

          docker compose --env-file /tmp/shiro.env --profile mongo-migration config > .github/final-validation/migration-compose.txt 2>&1
          printf '%s\n' "$?" > .github/final-validation/migration-compose.status

          docker build --check . > .github/final-validation/dockerfile.txt 2>&1
          printf '%s\n' "$?" > .github/final-validation/dockerfile.status

          docker build --progress=plain -t shiro-final-validation . > /tmp/docker-build.txt 2>&1
          printf '%s\n' "$?" > .github/final-validation/docker-build.status
          tail -n 400 /tmp/docker-build.txt > .github/final-validation/docker-build.txt

          grep -RInE \
            --include='*.ts' --include='*.tsx' \
            '(/api/v2|search\.proxy\(.algolia.|aggregate\.proxy\.(feed|sitemap)|createClient\(fetchAdaptor\))' \
            apps/web/src > .github/final-validation/legacy-routes.txt || true
          grep -nE '(node:20|node:lts|--arch=x64)' Dockerfile .drone.yml >> .github/final-validation/legacy-routes.txt || true
          exit 0
      - name: Summarize and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('.github/final-validation')
          names = ['typecheck', 'build', 'compose', 'migration-compose', 'dockerfile', 'docker-build']
          result = {
              name.replace('-', ''): int((base / f'{name}.status').read_text().strip())
              for name in names
          }
          result['legacyRouteHits'] = len((base / 'legacy-routes.txt').read_text().splitlines())
          (base / 'summary.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/final-validation
          git commit -m 'chore: record final end-to-end validation'
          git push
