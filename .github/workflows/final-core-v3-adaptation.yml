name: Final Core v3 adaptation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-core-v3-adaptation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapt-and-validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Replace removed routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('apps/web/src/components/modules/shared/SearchFAB.tsx')
          text = path.read_text()
          text = text.replace("import { useIsOwnerLogged } from '~/atoms/hooks/owner'\n", '')
          text = text.replace("import { MotionButtonBase } from '~/components/ui/button'\n", '')
          text = text.replace("import { FloatPopover } from '~/components/ui/float-popover'\n", '')

          text, count = re.subn(
              r"return\s+apiClient\.search\.proxy\('algolia'\)\.get\(\{\s*params:\s*\{\s*keyword,?\s*\},\s*\}\)",
              "return (apiClient.search as any).searchAll(String(keyword))",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Algolia search call, replaced {count}')

          text = text.replace('  const isLogged = useIsOwnerLogged()\n\n', '', 1)
          footer_start_marker = (
              '      <div className="flex shrink-0 items-center justify-between px-4 py-2">'
          )
          footer_end_marker = '      </div>\n    </m.div>'
          start = text.find(footer_start_marker)
          end = text.find(footer_end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Algolia footer markers not found')
          text = (
              text[:start]
              + '      <div className="flex shrink-0 items-center justify-end px-4 py-2 text-xs text-zinc-500">\n'
              + '        Mix Space Search\n'
              + '      </div>\n'
              + text[end + len('      </div>\n'):]
          )
          path.write_text(text)

          proxy_template = """import { API_URL, GATEWAY_URL } from '~/constants/env'

export const dynamic = 'force-dynamic'
export const revalidate = __TTL__

function resolveCoreRoot() {
  if (/^https?:\\/\\//.test(API_URL)) {
    return API_URL.replace(/\\/api\\/v3\\/?$/, '').replace(/\\/$/, '')
  }
  if (/^https?:\\/\\//.test(GATEWAY_URL)) {
    return GATEWAY_URL.replace(/\\/$/, '')
  }
  return 'http://localhost:2333'
}

export async function GET() {
  const response = await fetch(`${resolveCoreRoot()}__PATH__`, {
    next: { revalidate },
  })

  if (!response.ok) {
    return new Response(`Core request failed: ${response.status}`, {
      status: 502,
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
    })
  }

  return new Response(await response.text(), {
    headers: {
      'Content-Type': 'application/xml; charset=utf-8',
      'Cache-Control': `max-age=60, s-maxage=${revalidate}`,
    },
  })
}
"""
          Path('apps/web/src/app/feed/route.tsx').write_text(
              proxy_template.replace('__TTL__', '60').replace('__PATH__', '/feed')
          )
          Path('apps/web/src/app/[locale]/sitemap/route.tsx').write_text(
              proxy_template.replace('__TTL__', '3600').replace('__PATH__', '/sitemap')
          )
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application and deployment
        shell: bash
        run: |
          set +e
          mkdir -p .github/final-core-v3-validation

          pnpm --filter @shiro/web exec tsc --noEmit > .github/final-core-v3-validation/typecheck.txt 2>&1
          printf '%s\n' "$?" > .github/final-core-v3-validation/typecheck.status

          pnpm --filter @shiro/web run build:ci > .github/final-core-v3-validation/build.txt 2>&1
          printf '%s\n' "$?" > .github/final-core-v3-validation/build.status

          cat > /tmp/shiro.env <<'EOF'
          POSTGRES_PASSWORD=validation-password
          JWT_SECRET=validation-only-jwt-secret-with-sufficient-length
          ENCRYPT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PUBLIC_CORE_ORIGIN=http://localhost:2333
          PUBLIC_CORE_API_URL=http://localhost:2333/api/v3
          EOF
          docker compose --env-file /tmp/shiro.env config > .github/final-core-v3-validation/compose.txt 2>&1
          printf '%s\n' "$?" > .github/final-core-v3-validation/compose.status

          docker build --check . > .github/final-core-v3-validation/dockerfile.txt 2>&1
          printf '%s\n' "$?" > .github/final-core-v3-validation/dockerfile.status

          docker build --progress=plain -t shiro-core-v3-validation . > /tmp/docker-build.txt 2>&1
          printf '%s\n' "$?" > .github/final-core-v3-validation/docker-build.status
          tail -n 300 /tmp/docker-build.txt > .github/final-core-v3-validation/docker-build.txt

          grep -RInE \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
            --exclude-dir=architecture-audit --exclude-dir=final-core-v3-validation \
            '(/api/v2|MONGO_|mongodb://|node:20|node:lts|search\.proxy\(.algolia.|aggregate\.proxy\.(feed|sitemap))' \
            . > .github/final-core-v3-validation/legacy-hits.txt || true
          exit 0

      - name: Summarize
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('.github/final-core-v3-validation')
          keys = ['typecheck', 'build', 'compose', 'dockerfile', 'docker-build']
          result = {
              key.replace('-', ''): int((base / f'{key}.status').read_text().strip())
              for key in keys
          }
          result['legacyHitCount'] = len((base / 'legacy-hits.txt').read_text().splitlines())
          (base / 'summary.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Commit fixes and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src .github/final-core-v3-validation
          git commit -m 'fix: finish Core v3 route adaptation'
          git push
