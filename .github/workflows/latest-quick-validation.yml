name: Cleanup adaptation artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/latest-quick-validation.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove temporary workflows and reports
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/architecture-audit \
            .github/final-core-v3-validation \
            .github/postgresql-validation \
            .github/final-validation \
            .github/latest-main-validation \
            .github/latest-quick-validation

          rm -f \
            .github/workflows/architecture-audit.yml \
            .github/workflows/final-core-v3-adaptation.yml \
            .github/workflows/search-native-adapt.yml \
            .github/workflows/search-patch-only.yml \
            .github/workflows/final-validation.yml \
            .github/workflows/og-client-adapt.yml \
            .github/workflows/og-patch-only.yml \
            .github/workflows/really-final-validation.yml \
            .github/workflows/latest-main-validation.yml \
            .github/workflows/latest-quick-validation.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github
          git commit -m 'chore: remove temporary adaptation workflows'
          git push
