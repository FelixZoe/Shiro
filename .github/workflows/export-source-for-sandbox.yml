name: Export source for sandbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-source-for-sandbox.yml

permissions:
  contents: write

env:
  EXPORT_PATH: .github/source-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          printf '%s\n' "${{ github.run_id }}" > "$EXPORT_PATH/run-id.txt"
          printf '%s\n' "${{ github.sha }}" > "$EXPORT_PATH/source-sha.txt"
          tar --exclude=.git --exclude=.github/source-export -czf /tmp/shiro-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: shiro-source
          path: /tmp/shiro-source.tar.gz
          retention-days: 1

      - name: Record export metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EXPORT_PATH"
          git commit -m 'chore: record sandbox source export'
          git push
