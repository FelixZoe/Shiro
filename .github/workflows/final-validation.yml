name: Final PostgreSQL adaptation validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all layers
        shell: bash
        run: |
          set +e
          mkdir -p .github/postgresql-validation

          pnpm --filter @shiro/web exec tsc --noEmit > .github/postgresql-validation/typecheck.txt 2>&1
          printf '%s\n' "$?" > .github/postgresql-validation/typecheck.status

          pnpm --filter @shiro/web run build:ci > .github/postgresql-validation/build.txt 2>&1
          printf '%s\n' "$?" > .github/postgresql-validation/build.status

          cat > /tmp/shiro.env <<'EOF'
          POSTGRES_PASSWORD=validation-password
          JWT_SECRET=validation-only-jwt-secret-with-sufficient-length
          ENCRYPT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PUBLIC_CORE_ORIGIN=http://localhost:2333
          PUBLIC_CORE_API_URL=http://localhost:2333/api/v3
          MONGO_URI=mongodb://host.docker.internal:27017/mx-space
          MIGRATION_MODE=dry-run
          EOF

          docker compose --env-file /tmp/shiro.env config > .github/postgresql-validation/compose.txt 2>&1
          printf '%s\n' "$?" > .github/postgresql-validation/compose.status

          docker compose --env-file /tmp/shiro.env --profile mongo-migration config > .github/postgresql-validation/migration-compose.txt 2>&1
          printf '%s\n' "$?" > .github/postgresql-validation/migration-compose.status

          docker build --check . > .github/postgresql-validation/dockerfile.txt 2>&1
          printf '%s\n' "$?" > .github/postgresql-validation/dockerfile.status

          docker build --progress=plain -t shiro-postgresql-validation . > /tmp/docker-build.txt 2>&1
          printf '%s\n' "$?" > .github/postgresql-validation/docker-build.status
          tail -n 400 /tmp/docker-build.txt > .github/postgresql-validation/docker-build.txt

          grep -RInE \
            --include='*.ts' --include='*.tsx' \
            '(/api/v2|search\.proxy\(.algolia.|aggregate\.proxy\.(feed|sitemap))' \
            apps/web/src > .github/postgresql-validation/legacy-routes.txt || true
          grep -nE '(node:20|node:lts)' Dockerfile .drone.yml >> .github/postgresql-validation/legacy-routes.txt || true
          exit 0

      - name: Write summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('.github/postgresql-validation')
          names = [
              'typecheck',
              'build',
              'compose',
              'migration-compose',
              'dockerfile',
              'docker-build',
          ]
          result = {
              name.replace('-', ''): int((base / f'{name}.status').read_text().strip())
              for name in names
          }
          result['legacyRouteHits'] = len((base / 'legacy-routes.txt').read_text().splitlines())
          (base / 'summary.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/postgresql-validation
          git commit -m 'chore: record final PostgreSQL adaptation validation'
          git push
