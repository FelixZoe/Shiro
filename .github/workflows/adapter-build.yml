name: Core compatibility build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adapter-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VALIDATION_PASS: '4'
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compatibility check
        shell: bash
        run: |
          set +e
          mkdir -p .github/adapter-build
          pnpm --filter @shiro/web exec tsc --noEmit 2>&1 | tee .github/adapter-build/typecheck.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .github/adapter-build/typecheck.status
          exit 0

      - name: Run production build
        shell: bash
        run: |
          set +e
          pnpm --filter @shiro/web run build:ci 2>&1 | tee .github/adapter-build/build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .github/adapter-build/build.status
          exit 0

      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/adapter-build
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Core compatibility check'
            git push
          fi
