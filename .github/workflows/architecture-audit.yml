name: Architecture audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/architecture-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect architecture files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/architecture-audit
          find . -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './.next/*' \
            -not -path './.github/architecture-audit/*' \
            | sed 's#^./##' | sort > .github/architecture-audit/tree.txt

          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=architecture-audit \
            '(/api/v2|mongo(db)?|MONGO_|node:20|node:lts|NEXT_PUBLIC_API_URL|NEXT_PUBLIC_CLIENT_API_URL|NEXT_PUBLIC_GATEWAY_URL|docker-compose)' \
            . > .github/architecture-audit/legacy-hits.txt || true
      - name: Commit audit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/architecture-audit
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record legacy deployment references'
          git push
