name: Remove adaptation diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adapter-build.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove temporary adaptation files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/adapter-build \
            .github/adapter-inventory \
            .github/workflows/adapter-inventory.yml \
            .github/workflows/adapter-build.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove adaptation diagnostics'
          git push
