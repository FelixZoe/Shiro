name: Apply OG compatibility patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/og-patch-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch OG route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('apps/web/src/app/[locale]/og/route.tsx')
          text = path.read_text()
          text, count = re.subn(
              r"import type \{ Image \} from '@mx-space/api-client'\nimport \{.*?\} from '@mx-space/api-client'\nimport \{ fetchAdaptor \} from '@mx-space/api-client/dist/adaptors/fetch'\n",
              "import type { Image } from '@mx-space/api-client'\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'old OG imports replaced {count} times')
          text = text.replace("import { API_URL } from '~/constants/env'\n", '', 1)
          text = text.replace(
              "import zhMessages from '~/messages/zh/common.json'\n",
              "import zhMessages from '~/messages/zh/common.json'\nimport { apiClient } from '~/lib/request'\n",
              1,
          )
          text, count = re.subn(
              r"const apiClient = createClient\(fetchAdaptor\)\(API_URL, \{.*?\n\}\)\n\n",
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'old OG client factory replaced {count} times')
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- 'apps/web/src/app/[locale]/og/route.tsx'
          git commit -m 'fix: use Core v3 compatibility client for OG routes'
          git push
