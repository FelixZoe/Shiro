name: Adapt native search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/search-native-adapt.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Replace Algolia search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('apps/web/src/components/modules/shared/SearchFAB.tsx')
          text = path.read_text()
          text = text.replace("import { useIsOwnerLogged } from '~/atoms/hooks/owner'\n", '')
          text = text.replace("import { MotionButtonBase } from '~/components/ui/button'\n", '')
          text = text.replace("import { FloatPopover } from '~/components/ui/float-popover'\n", '')

          text, count = re.subn(
              r"return\s+apiClient\.search\.proxy\('algolia'\)\.get\(\{\s*params:\s*\{\s*keyword,?\s*\},\s*\}\)",
              "return (apiClient.search as any).searchAll(String(keyword))",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Algolia search call, replaced {count}')

          text = text.replace('  const isLogged = useIsOwnerLogged()\n\n', '', 1)
          start_marker = '      <div className="flex shrink-0 items-center justify-between px-4 py-2">'
          end_marker = '      </div>\n    </m.div>'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Algolia footer markers not found')
          text = (
              text[:start]
              + '      <div className="flex shrink-0 items-center justify-end px-4 py-2 text-xs text-zinc-500">\n'
              + '        Mix Space Search\n'
              + '      </div>\n'
              + text[end + len('      </div>\n'):]
          )
          path.write_text(text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @shiro/web exec tsc --noEmit
          pnpm --filter @shiro/web run build:ci
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/modules/shared/SearchFAB.tsx
          git commit -m 'fix: use Core v3 native search'
          git push
