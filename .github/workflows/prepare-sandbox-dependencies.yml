name: Prepare sandbox dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-sandbox-dependencies.yml

permissions:
  contents: write

env:
  META_PATH: .github/sandbox-deps-export

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Package installed dependency trees
        run: |
          set -euo pipefail
          mkdir -p "$META_PATH"
          printf '%s\n' "${{ github.run_id }}" > "$META_PATH/run-id.txt"
          printf '%s\n' "${{ github.sha }}" > "$META_PATH/source-sha.txt"
          find . -type d -name node_modules -prune -print0 | \
            tar --null -T - -czf /tmp/shiro-node-modules.tar.gz
          du -h /tmp/shiro-node-modules.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: shiro-node-modules
          path: /tmp/shiro-node-modules.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Record dependency export metadata
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$META_PATH"
          git commit -m 'chore: record sandbox dependency export'
          git push
