name: Adapter inventory

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adapter-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build compatibility inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/adapter-inventory

          find apps/web/src -type f -not -path '*/node_modules/*' | sort \
            > .github/adapter-inventory/tree.txt

          grep -RInE "from ['\"]@mx-space/api-client['\"]|import\(['\"]@mx-space/api-client['\"]\)" apps/web/src 2>/dev/null \
            > .github/adapter-inventory/imports.txt || true

          {
            grep -RIlE '@mx-space/api-client|apiClient|mxClient|aggregate|/api/v2|skills|better-auth|socket\.io|fetch\(' apps/web/src 2>/dev/null || true
            printf '%s\n' apps/web/package.json package.json pnpm-workspace.yaml
            find apps/web -maxdepth 2 -type f \( -name 'next.config.*' -o -name 'middleware.*' -o -name 'instrumentation.*' \) 2>/dev/null || true
          } | awk 'NF' | sort -u > .github/adapter-inventory/api-files.txt

          : > .github/adapter-inventory/api-snapshot.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            printf '\n===== FILE: %s =====\n' "$file" >> .github/adapter-inventory/api-snapshot.txt
            cat "$file" >> .github/adapter-inventory/api-snapshot.txt
            printf '\n' >> .github/adapter-inventory/api-snapshot.txt
          done < .github/adapter-inventory/api-files.txt

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/adapter-inventory
          git diff --cached --quiet && exit 0
          git commit -m 'chore: generate api compatibility inventory'
          git push
