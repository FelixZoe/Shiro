name: Core compatibility build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adapter-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapt-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply Core 13 compatibility layer
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs')
          const webPath = 'apps/web/package.json'
          const rootPath = 'package.json'
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'))
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'))

          // Keep v2 for the legacy Shiro model types while using v5 for all live requests.
          web.dependencies['@mx-space/api-client'] = '2.3.0'
          web.dependencies['@mx-space/api-client-v5'] = 'npm:@mx-space/api-client@5.6.0'
          root.engines = { ...(root.engines || {}), node: '>=22' }

          fs.writeFileSync(webPath, JSON.stringify(web, null, 2) + '\n')
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n')
          NODE

          cat > apps/web/src/lib/fetch/shared.ts <<'EOF'
          import type { IRequestAdapter } from '@mx-space/api-client-v5'
          import { allControllers } from '@mx-space/api-client-v5'
          import { createLegacyApiClient } from '@mx-space/api-client-v5/legacy'
          import type { $fetch } from 'ofetch'

          import { API_URL } from '~/constants/env'

          type FetchType = typeof $fetch
          export const createFetchAdapter = (
            $fetch: FetchType,
          ): IRequestAdapter<typeof $fetch> => ({
            default: $fetch,
            get(url: string, options) {
              const { params, ...rest } = options || {}
              return $fetch(url, {
                ...rest,
                method: 'GET',
                query: params,
              })
            },
            post(url: string, options) {
              const { params, data, ...rest } = options || {}
              return $fetch(url, {
                ...rest,
                method: 'post',
                query: params,
                body: data,
              })
            },
            put(url: string, options) {
              const { params, data, ...rest } = options || {}
              return $fetch(url, {
                ...rest,
                method: 'put',
                query: params,
                body: data,
              })
            },
            patch(url: string, options) {
              const { params, data, ...rest } = options || {}
              return $fetch(url, {
                ...rest,
                method: 'patch',
                query: params,
                body: data,
              })
            },
            delete(url: string, options) {
              const { params, data, ...rest } = options || {}
              return $fetch(url, {
                ...rest,
                method: 'delete',
                query: params,
                body: data,
              })
            },
          })

          const normalizeLegacyFields = (value: any): any => {
            if (Array.isArray(value)) return value.map(normalizeLegacyFields)
            if (!value || typeof value !== 'object') return value

            const next = Object.fromEntries(
              Object.entries(value).map(([key, item]) => [
                key,
                normalizeLegacyFields(item),
              ]),
            ) as Record<string, any>

            if (next.created === undefined && next.createdAt !== undefined) {
              next.created = next.createdAt
            }
            if (next.modified === undefined && next.modifiedAt !== undefined) {
              next.modified = next.modifiedAt
            }
            if (
              next.count === undefined &&
              (next.readCount !== undefined || next.likeCount !== undefined)
            ) {
              next.count = {
                read: next.readCount ?? 0,
                like: next.likeCount ?? 0,
              }
            }
            // Core 13 removed the per-document switch. Global comment settings
            // remain authoritative, while legacy Shiro expects this flag.
            if (
              next.allowComment === undefined &&
              typeof next.id === 'string' &&
              (typeof next.text === 'string' || typeof next.content === 'string')
            ) {
              next.allowComment = true
            }

            return next
          }

          const shiroCompatibilityAdapter = {
            transformData(data: any) {
              return normalizeLegacyFields(data)
            },
          }

          export const createApiClient = (
            fetchAdapter: ReturnType<typeof createFetchAdapter>,
          ) =>
            createLegacyApiClient(fetchAdapter)(API_URL, {
              controllers: allControllers,
              responseAdapter: shiroCompatibilityAdapter,
            }) as any
          EOF

          cat > apps/web/src/lib/request.shared.ts <<'EOF'
          import { RequestError } from '@mx-space/api-client-v5'
          import type { FetchError } from 'ofetch'

          export const getErrorMessageFromRequestError = (error: RequestError) => {
            if (!(error instanceof RequestError)) return (error as Error).message

            const fetchError = error.raw as FetchError
            const payload = fetchError.response?._data as
              | {
                  error?: { message?: string | string[] }
                  message?: string | string[]
                }
              | undefined
            const messagesOrMessage = payload?.error?.message ?? payload?.message
            const bizMessage =
              typeof messagesOrMessage === 'string'
                ? messagesOrMessage
                : Array.isArray(messagesOrMessage)
                  ? messagesOrMessage[0]
                  : undefined

            return bizMessage || error.message || fetchError.message
          }
          EOF

          cat > apps/web/src/app/'[locale]'/api.tsx <<'EOF'
          import type { AggregateRoot } from '@mx-space/api-client'

          import { defaultThemeConfig } from '~/app.default.theme-config'
          import { appStaticConfig } from '~/app.static.config'
          import { attachServerFetch } from '~/lib/attach-fetch'
          import { deepMerge } from '~/lib/lodash'
          import { getQueryClient } from '~/lib/query-client.server'
          import { apiClient } from '~/lib/request'

          const cacheTime = appStaticConfig.cache.enabled
            ? appStaticConfig.cache.ttl.aggregation
            : 1

          export const fetchAggregationData = async () => {
            await attachServerFetch()
            const queryClient = getQueryClient()
            const fetcher = async () => {
              const [aggregateResponse, pageResponse] = await Promise.all([
                apiClient.aggregate.getAggregateData('shiro'),
                apiClient.page.getList(1, 100, {
                  sortBy: 'order',
                  sortOrder: 1,
                }),
              ])

              const data = (aggregateResponse.$serialized ?? aggregateResponse) as
                | (AggregateRoot & { theme?: AppThemeConfig })
                | undefined
              const pages = pageResponse?.data ?? []

              return {
                ...data,
                // Core 11+ removed pageMeta from /aggregate; rebuild the small
                // navigation projection from the canonical page list endpoint.
                pageMeta: pages.map((page: any) => ({
                  id: page.id,
                  title: page.title,
                  slug: page.slug,
                  subtitle: page.subtitle,
                })),
                theme: data?.theme
                  ? deepMerge(defaultThemeConfig, data.theme)
                  : defaultThemeConfig,
              }
            }

            return queryClient.fetchQuery({
              queryKey: ['aggregate', 'shiro'],
              queryFn: fetcher,
              staleTime: cacheTime,
              gcTime: cacheTime,
            })
          }
          EOF

          cat > apps/web/src/queries/definition/aggregation.ts <<'EOF'
          import type { AggregateRoot } from '@mx-space/api-client'
          import { isServer } from '@tanstack/react-query'

          import { apiClient } from '~/lib/request'

          import { defineQuery } from '../helper'

          export const aggregation = {
            root: () =>
              defineQuery({
                queryKey: ['aggregation'],
                queryFn: async () => {
                  const [aggregateResponse, pageResponse] = await Promise.all([
                    apiClient.aggregate.getAggregateData('shiro'),
                    apiClient.page.getList(1, 100, {
                      sortBy: 'order',
                      sortOrder: 1,
                    }),
                  ])
                  const data = aggregateResponse.$serialized ?? aggregateResponse

                  return {
                    ...(data as AggregateRoot & { theme: AppThemeConfig }),
                    pageMeta: (pageResponse?.data ?? []).map((page: any) => ({
                      id: page.id,
                      title: page.title,
                      slug: page.slug,
                      subtitle: page.subtitle,
                    })),
                  }
                },
                gcTime: 1000 * 60 * 10,
                staleTime: isServer ? 1000 * 60 * 10 : undefined,
              }),
          }
          EOF

          python <<'PY'
          from pathlib import Path

          replacements = {
              'apps/web/src/lib/request.server.ts': [
                  ("from '@mx-space/api-client'", "from '@mx-space/api-client-v5'"),
              ],
              'apps/web/src/providers/root/react-query-provider.tsx': [
                  ("from '@mx-space/api-client'", "from '@mx-space/api-client-v5'"),
              ],
              'apps/web/src/app/[locale]/friends/page.tsx': [
                  (
                      "import { LinkState, LinkType, RequestError } from '@mx-space/api-client'",
                      "import { LinkState, LinkType } from '@mx-space/api-client'\nimport { RequestError } from '@mx-space/api-client-v5'",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          hooks = Path('apps/web/src/components/modules/comment/CommentBox/hooks.tsx')
          text = hooks.read_text()
          text = text.replace(
              "import type {\n  CommentDto,\n  CommentModel,\n  RequestError,\n} from '@mx-space/api-client'",
              "import type { CommentDto, CommentModel } from '@mx-space/api-client'\nimport type { RequestError } from '@mx-space/api-client-v5'",
          )
          text = text.replace(
              "return apiClient.comment.proxy.owner\n            .reply(refId)\n            .post<CommentModel>({\n              data: {\n                text,\n                source,\n              },\n            })\n            .then(wrappedCompletedCallback)",
              "return apiClient.comment\n            .readerReply(refId, {\n              text,\n              source,\n              ...(anchor ? { anchor } : {}),\n            } as any)\n            .then(wrappedCompletedCallback)",
          )
          text = text.replace(
              "return apiClient.comment\n            .reply(refId, commentDto)\n            .then(wrappedCompletedCallback)",
              "return apiClient.comment\n            .guestReply(refId, commentDto as any)\n            .then(wrappedCompletedCallback)",
          )
          text = text.replace(
              "return apiClient.comment.proxy.owner\n          .comment(refId)\n          .post<CommentModel>({\n            data: { text, source, ...(anchor ? { anchor } : {}) },\n          })",
              "return apiClient.comment\n          .readerComment(refId, {\n            text,\n            isWhispers: isWhisper,\n            source,\n            ...(anchor ? { anchor } : {}),\n          } as any)",
          )
          text = text.replace(
              "return apiClient.comment\n        .comment(refId, commentDto)\n        .then(wrappedCompletedCallback)",
              "return apiClient.comment\n        .guestComment(refId, commentDto as any)\n        .then(wrappedCompletedCallback)",
          )
          hooks.write_text(text)
          PY

          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json apps/web/package.json pnpm-lock.yaml apps/web/src
          if ! git diff --cached --quiet; then
            git commit -m 'fix: adapt Shiro to Core 13 compatibility client'
            git push
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compatibility check
        shell: bash
        run: |
          set +e
          mkdir -p .github/adapter-build
          pnpm --filter @shiro/web exec tsc --noEmit > .github/adapter-build/typecheck.log 2>&1
          status=$?
          printf '%s\n' "$status" > .github/adapter-build/typecheck.status
          exit 0

      - name: Run production build
        shell: bash
        run: |
          set +e
          pnpm --filter @shiro/web build > .github/adapter-build/build.log 2>&1
          status=$?
          printf '%s\n' "$status" > .github/adapter-build/build.status
          exit 0

      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git add .github/adapter-build
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Core compatibility check'
            git push
          fi
