name: Build runtime for sandbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-runtime-for-sandbox.yml

permissions:
  contents: write

env:
  META_PATH: .github/runtime-export
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record run metadata
        run: |
          set -euo pipefail
          mkdir -p "$META_PATH"
          printf '%s\n' "${{ github.run_id }}" > "$META_PATH/run-id.txt"
          printf '%s\n' "${{ github.sha }}" > "$META_PATH/source-sha.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$META_PATH"
          git commit -m 'chore: record sandbox runtime build run'
          git push

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm --filter @shiro/web run build:ci

      - name: Package standalone runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/shiro-runtime/apps/web/.next
          cp -a apps/web/.next/standalone/. /tmp/shiro-runtime/
          cp -a apps/web/.next/static /tmp/shiro-runtime/apps/web/.next/static
          cp -a apps/web/public /tmp/shiro-runtime/apps/web/public
          test -f /tmp/shiro-runtime/apps/web/server.js
          tar -C /tmp -czf /tmp/shiro-runtime.tar.gz shiro-runtime
          du -h /tmp/shiro-runtime.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: shiro-runtime
          path: /tmp/shiro-runtime.tar.gz
          compression-level: 0
          retention-days: 1
